<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Core Init F0.11</title>
    <style>
        html, body { margin: 0; background: #0c0b11; color: #e8e6f0; font-family: sans-serif; }
        #splash { font-size: 34px; padding: 32px 48px 0; }
        #splash b { color: #9d85ff; }
        #board { padding: 8px 48px; }
        .row { margin: 14px 0; }
        .row h3 { font-size: 24px; margin: 0 0 8px; color: #b9b3d6; }
        .cards { white-space: nowrap; overflow: hidden; }
        .card { display: inline-block; width: 150px; height: 84px; margin-right: 12px; padding: 8px; box-sizing: border-box;
                background: #22202e; border-radius: 6px; font-size: 15px; white-space: normal; vertical-align: top; overflow: hidden; }
        #status { font-size: 17px; line-height: 1.3; padding: 0 48px; white-space: pre-wrap; word-break: break-all; color: #8f8aa6; }
    </style>
    <script>
        // O mais cedo possível: o relógio da página começa no navigationStart.
        window.__early = { headMs: performance.now() };
    </script>
</head>
<body>
    <div id="splash"><b>Stremio</b> · iniciando o core…</div>
    <div id="board"></div>
    <pre id="status"></pre>
    <script src="main.js"></script>
</body>
</html>
